<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>十方上学记 · 文章预览</title>
<style>
  :root {
    --bg: #ffffff; --bg-soft: #f6f7f9; --fg: #1f2328; --fg-dim: #6a737d;
    --line: #e4e7eb; --accent: #0969da; --active-bg: #eaf3fd;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --bg-soft: #161b22; --fg: #e6edf3; --fg-dim: #8b949e;
      --line: #30363d; --accent: #58a6ff; --active-bg: #1f2e3f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--fg); background: var(--bg); }
  header { position: fixed; top: 0; left: 0; right: 0; height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--bg); z-index: 10; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; white-space: nowrap; }
  header .count { color: var(--fg-dim); font-size: 12px; white-space: nowrap; }
  #search { flex: 1; max-width: 360px; margin-left: auto; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg-soft); color: var(--fg); font-size: 13px; outline: none; }
  #search:focus { border-color: var(--accent); }
  nav { position: fixed; top: 52px; bottom: 0; left: 0; width: 300px; overflow-y: auto; border-right: 1px solid var(--line); background: var(--bg-soft); padding: 8px; }
  nav .item { padding: 8px 10px; border-radius: 8px; cursor: pointer; }
  nav .item:hover { background: var(--active-bg); }
  nav .item.active { background: var(--active-bg); }
  nav .item .d { font-size: 11px; color: var(--fg-dim); }
  nav .item .t { font-size: 13px; line-height: 1.45; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  main { position: fixed; top: 52px; bottom: 0; left: 300px; right: 0; overflow-y: auto; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 36px 28px 80px; }
  .meta { color: var(--fg-dim); font-size: 13px; margin-bottom: 4px; }
  .links { margin: 6px 0 0; font-size: 13px; }
  .links a { color: var(--accent); text-decoration: none; margin-right: 14px; }
  article { line-height: 1.85; font-size: 16px; }
  article img { max-width: 100%; height: auto; border-radius: 6px; }
  article h1, article h2, article h3 { line-height: 1.4; }
  article blockquote { margin: 1em 0; padding: 2px 14px; border-left: 3px solid var(--accent); background: var(--bg-soft); border-radius: 0 6px 6px 0; color: var(--fg-dim); }
  article hr { border: none; border-top: 1px solid var(--line); margin: 2em 0; }
  article a { color: var(--accent); }
  article code { background: var(--bg-soft); padding: 1px 5px; border-radius: 4px; font-size: 90%; }
  .placeholder { color: var(--fg-dim); text-align: center; margin-top: 30vh; }
  @media (max-width: 900px) {
    nav { width: 240px; }
    main { left: 240px; }
  }
</style>
</head>
<body>
<header>
  <h1>十方上学记</h1>
  <span class="count">共 4 篇 · 内容与 content/posts/ 实时同步</span>
  <input id="search" type="search" placeholder="搜索文章标题…">
</header>
<nav id="list"></nav>
<main><div class="wrap" id="view"><div class="placeholder">← 从左侧选择一篇文章</div></div></main>

<script>
const ARTICLES = [{"file": "十方上学记｜三妞过生日，大人忙着点蜡烛，我们小孩只关心一件事.md", "title": "十方上学记｜三妞过生日，大人忙着点蜡烛，我们小孩只关心一件事", "date": "2026-11-15T18:40:00+08:00", "source": "https://mp.weixin.qq.com/s?__biz=MzIwMjM0NDM1Nw==&mid=2247484461&idx=1&sn=1f2d1e2588bcb917ab8c72c1d1777f49&chksm=97ff70e29141bdd7f33fcc1b0d8bd80d40ff24a5b34b54ccf5a0852e7505806057d61e483d8e", "md": "\n三妞是我堂妹，大伯家的女儿，11月17号生日，下周二。大人要上班，所以提前到今天过。\n\n今天上午我还在上学而思数学，11:50才放学。我爸接上我，先去超市买了三束小雏菊，说是给大娘、二妈和奶奶的。我在旁边看着，心想：花是挺好看，但今天的主角是三妞，你们大人怎么还给自己买上了。不过收到花的人确实都笑了，行吧，这钱花得不算冤。\n\n到了饭店，人已经齐了。四个小孩：大宝、我、三妞、四妞。大宝和四妞是爹爹家的，三妞是大伯家的，我是我爸家的。四妞才两岁，最小的那个，最可爱也最能捣乱。我们四个凑一块儿，饭店包间差点装不下。\n\n菜上来了，很丰盛。但我跟你说实话，桌上没几个人认真吃。大人追着喂，我们象征性地张嘴，嚼两下，咽了，然后继续等蛋糕。谁稀罕菜啊。现在的小孩什么没吃过，再好的菜，不如蛋糕上那层奶油有吸引力。\n\n大宝最先坐不住了，说“吃饱了”，跑去旁边玩卡片。我和三妞一看，也跟着跑了。三个人围着一包圆卡片，玩得比吃饭认真多了。四妞在旁边看着，手一伸，把卡片搅乱，我们仨同时“哎——”了一声，但没人敢凶她，两岁，惹不起。\n\n大人吃得差不多了，终于开始张罗点蜡烛。那个忙啊，找打火机的找打火机，关灯的关灯，摆蛋糕的摆蛋糕，还有人喊“帽子呢帽子呢”。我们四个小孩就站在旁边看着，等他们忙完。\n\n三妞戴着生日帽，闭眼睛许愿，吹蜡烛。那个瞬间我瞄了她一眼，她表情特别认真，不知道许的什么愿。我没问，问了就不灵了。\n\n蛋糕是6寸的，不大。我听大人说，以前买大的都吃不完，所以越买越小。我觉得挺有道理，反正我们小孩吃两口就腻了，剩下的全靠大人解决。现在的孩子什么都不稀罕？这话我不同意。我们稀罕，只是稀罕的东西跟你们不一样。你们稀罕菜，我们稀罕蛋糕上的草莓。你们稀罕热闹，我们稀罕吃完能去玩。\n\n最后大人让我们四个站一块儿拍照。三妞8岁，我10岁，大宝11岁，四妞2岁。排一排，高矮差一大截，四妞站中间，被我们仨夹着，一脸懵。照片拍出来，我看了，挺好看的。就是四妞没看镜头，她在看旁边什么东西，不知道。\n\n吃完之后，大伯大娘他们骑电动车先走了。最后是爹爹——大宝和四妞他爸——带我们四个去游乐场。三妞下午本来有书法课，过生日破例请假了，跟着我们一起疯。\n\n结果到了游乐场，没进去。票务问题。一个大人带四个小孩，最小的才两岁，订的票没有合适的。爹爹在那儿跟工作人员说了半天，我们四个在旁边站着等，四妞已经开始不耐烦了，拽着大宝的袖子晃。\n\n进不去就进不去吧。爹爹一挥手，改道去公园。喂鸽子。\n\n三妞喂得最起劲，四妞追着鸽子跑，鸽子被她追得满天飞，她还在下面笑。大宝在旁边站着，假装很酷，其实手里也捏着鸽子食。一个大人带四个小孩，爹爹今天挺不容易的，但他在旁边看着我们跑，也没催。\n\n我蹲在那儿喂了一会儿，看着三妞。她8岁了。\n\n8岁是什么概念呢，就是她再也不是那个随便给颗糖就能哄走的小屁孩了。她有自己的愿望了，吹蜡烛的时候许的那个愿，我没问，但我知道她肯定认真想了。\n\n希望她平安健康快乐长大。这个我同意。但我还想加一句：下次过生日，能不能别提前。当天过，我还能在学校跟同学说“我昨天吃蛋糕了”。提前过，等上学都没人信。\n\n---\n\n> 本文首发于微信公众号「辰爸学育儿」，[查看原文](https://mp.weixin.qq.com/s?__biz=MzIwMjM0NDM1Nw==&mid=2247484461&idx=1&sn=1f2d1e2588bcb917ab8c72c1d1777f49&chksm=97ff70e29141bdd7f33fcc1b0d8bd80d40ff24a5b34b54ccf5a0852e7505806057d61e483d8e)。\n"}, {"file": "十方上学记｜午睡时间，我们宿舍把被子玩出了花.md", "title": "十方上学记｜午睡时间，我们宿舍把被子玩出了花", "date": "2026-11-14T18:48:00+08:00", "source": "https://mp.weixin.qq.com/s?__biz=MzIwMjM0NDM1Nw==&mid=2247484457&idx=1&sn=7802629997d9bc805b16613d9e8452ca&chksm=97b3b5905a262f120bca9538a33c5e60f0f5fb2f138173a74c2d2fa5a1b3a604d98927de4b3b", "md": "\n我们学校中午是要午睡的。\n\n但我跟你讲，我们宿舍的中午，跟“睡”这个字关系不大。\n\n先说我们宿舍的配置。四张床，上下铺，我们几个都在上铺。一到午睡时间，老师一走，上铺就活了。\n\n枕头大战是入门项目。这个不用多解释，就是拿枕头抡。谁先动手不重要，重要的是最后所有人都被卷进来，枕头满天飞，打到后来枕头芯都歪了。\n\n进阶版是“抛人”。这个玩法我至今觉得离谱：四个人站上铺，一人揪住被子一个角，把被子扯成一个兜，然后让全宿舍最轻的那个躺进去。一二三，往上抛。接住，再抛。那个最轻的哥们儿躺在被兜里，表情又爽又慌，我们四个揪被角的累得手酸，但谁也不肯松手。\n\n今天中午玩的是第三个版本。\n\n我们把被子往上下铺两个床中间一搭，垂下来，正好当窗帘。一边一个人，隔着被子窗帘对打。你打过来，我打过去，看不见对方，全凭感觉。被子晃来晃去，人影在缝隙里一闪一闪的，跟打擂台似的。\n\n今天参与的有我、小朱、小林、浩子、小橙子、小榛子，还有小李。上铺挤了一排，被子扯得吱吱响，有人笑得从铺上往下出溜，被旁边人一把拽回来。小橙子隔着帘子乱挥，打到了小榛子，小榛子不服，绕到另一边偷袭，结果撞到浩子身上，俩人滚成一团。\n\n正闹着，走廊里传来脚步声。\n\n一瞬间，所有人定住。被子不动了，人也不动了。小橙子还保持着一个挥拳的姿势，僵在那儿。浩子小声说“别出声别出声”，声音小得跟蚊子似的。\n\n脚步声过去了。\n\n过了三秒，不知道谁先没憋住，笑了一声，然后全宿舍炸了，笑成一团。\n\n午睡铃响的时候，我们被子叠得整整齐齐，人躺得规规矩矩。老师进来转了一圈，满意地点了点头。\n\n她不知道的是，我们的被子里还藏着刚才那场大战的余温。枕头芯是歪的，被角是皱的，小橙子的头发到现在还翘着一撮。\n\n午睡？睡了，但主要是笑累了才睡着的。\n\n明天中午玩什么，我们还没商量好。但被子肯定还得遭殃。\n\n---\n\n> 本文首发于微信公众号「辰爸学育儿」，[查看原文](https://mp.weixin.qq.com/s?__biz=MzIwMjM0NDM1Nw==&mid=2247484457&idx=1&sn=7802629997d9bc805b16613d9e8452ca&chksm=97b3b5905a262f120bca9538a33c5e60f0f5fb2f138173a74c2d2fa5a1b3a604d98927de4b3b)。\n"}, {"file": "十方上学记｜武术课上到一半，校长喊我们去菜园吃烤红薯.md", "title": "十方上学记｜武术课上到一半，校长喊我们去菜园吃烤红薯", "date": "2026-11-13T07:22:59+08:00", "source": "https://mp.weixin.qq.com/s?__biz=MzIwMjM0NDM1Nw==&mid=2247484453&idx=1&sn=1efff0c06adff92fcae3160c8fe782c9&chksm=9793220d0344b4b38ba2d38e8a789702dd0457cd0947d7ded25192dfe7da3f861146aed64372", "md": "\n事情是这样的。\n\n今天我们在操场上武术课，正练着呢，卢老师走过来，跟童老师说了几句话。我没听清，但看童老师的表情，感觉不是什么坏事。\n\n然后童老师转过身，冲我们喊了一句：校长在小菜园挖红薯、烤红薯，让我们过去吃。\n\n武术课。烤红薯。这两个词放一块儿，我脑子短路了半秒。\n\n全班愣了一秒，然后炸了。有人已经开始跑了，被童老师喊回来排队。我们排着队往小菜园走，那队形，说整齐吧，也不太整齐，主要是每个人脸上都写着“快点走”。\n\n到了小菜园，校长真在那儿。旁边一堆红薯，刚从地里挖出来的，还带着泥。校长说，别光吃，先帮忙挖。\n\n行吧。吃之前先干活，这个道理我懂。\n\n我们蹲在地里挖红薯，那场面挺壮观。有人挖出来一个特别大的，举起来喊“看我这个”，有人挖了半天就挖出来一根手指头那么细的，还不服气，说这根不算。我挖了几个，手上全是泥，指甲缝里也是，但我居然觉得挺好玩的。比武术课好玩。这话别告诉童老师。\n\n挖完红薯，校长拿出一个炉子。就那种烤红薯的炉子，往那儿一摆，开始烤。我们围在旁边等，那个香味一点一点飘出来，我跟你讲，那是我今年闻过最香的味道。等的时候我数了一下，我们班好几个人在咽口水，包括我。\n\n红薯烤好了，校长给我们每个人分了一个。\n\n我拿到手，烫，左右手来回倒，一边吹一边剥皮。咬第一口的时候，我脑子里就一个想法：刚才那些泥没白挖。\n\n我们蹲在菜园边上吃红薯，没人说话，都在吃。平时班里最吵的那几个，那会儿也安静了。就那种，嘴里塞满了，顾不上说话。\n\n吃完我手上还是黑的，嘴边上也是。回教室的路上，我看了一圈，大家差不多都这德行，互相看着笑。\n\n那天武术课没上完。但我学会了一件事：红薯从地里到嘴里，中间隔着一堆泥和一段等待，但最后那一口，值。\n\n下次校长再烤，我还去。挖多少都行。\n\n---\n\n> 本文首发于微信公众号「辰爸学育儿」，[查看原文](https://mp.weixin.qq.com/s?__biz=MzIwMjM0NDM1Nw==&mid=2247484453&idx=1&sn=1efff0c06adff92fcae3160c8fe782c9&chksm=9793220d0344b4b38ba2d38e8a789702dd0457cd0947d7ded25192dfe7da3f861146aed64372)。\n"}, {"file": "十方上学记｜我们班有人被写了两个脏字，刘老师没查，讲了个故事.md", "title": "十方上学记｜我们班有人被写了两个脏字，刘老师没查，讲了个故事", "date": "2026-11-12T17:52:16+08:00", "source": "https://mp.weixin.qq.com/s?__biz=MzIwMjM0NDM1Nw==&mid=2247484448&idx=1&sn=9056eabb455248d6399dd51f677c6c33&chksm=97b3df80f5eb878125f8f00efbb2489614abfbf88ebf77a7dd0894cfe0ea43a698d93ed28de8", "md": "\n我们班有个同学，我管他叫小朱。\n\n小朱在班里不太招人待见，好多人烦他。说实话，我以前也不太跟他玩。他家里情况有点特殊，爸妈离了，妈妈又结了婚，他性格上跟别人不太一样，有时候怪怪的，有时候又让人不知道怎么接话。\n\n这天出事了。\n\n他的作业本封面上，不知道被谁写了两个字。很难听的两个脏字(sb)。小朱看到了，当场就哭了。他跑去跟老师说了，回家也跟他妈妈说了。\n\n他妈妈特别生气，直接在班级群里发了很长一段话，质问是谁写的，让写字的那个小朋友出来承认，还要求班主任给一个明确的答复。群里那气氛，我隔着屏幕都觉得紧张。\n\n刘老师不好做。真的不好做。一边是家长要说法，一边是班里这群十岁的小孩，查吧，伤感情，不查吧，交代不过去。\n\n第二天语文课，刘老师没上课。她说，今天我们不讲课文，我给你们讲个故事。\n\n她讲她以前带过一届学生。那届有个同学，拿了学校发的一笔激励奖金，放在书桌抽屉里，结果被偷了。刘老师也没安排全班搜查，也没一个个问。她就公开讲了这个事，说不管是谁拿的，一天之内，悄悄放回去，再写封道歉信，这事就算了。\n\n结果到了时间，钱真的回去了。抽屉里还多了一封道歉信。\n\n具体是谁，刘老师说不在乎。大家都还小，才四年级，谁还没个一念之差，谁还没个开玩笑开过头的时候。\n\n讲完这个故事，刘老师看着我们，说：这次在别人本子上写字的同学，周五放学前，写封道歉信，悄悄放到我讲台抽屉里。我不追究。\n\n后来周五过去了。具体有没有那封道歉信，是谁写的，我们也不知道。刘老师没说。\n\n但这件事我记了很久。\n\n我以前也觉得小朱烦。但那天看他哭，我突然觉得，如果那两个字写在我的本子上，我可能也会哭。刘老师没查，没骂，没揪人，但她说的话我好像听懂了。有些事不是查不出来，是查出来之后，那个被查出来的人，可能就再也抬不起头了。\n\n刘老师给的不是答案，是一个台阶。\n\n至于小朱，他还是那个小朱。但后来再有人拿他开玩笑，我会想起那两个字，然后就不笑了。\n\n---\n\n> 本文首发于微信公众号「辰爸学育儿」，[查看原文](https://mp.weixin.qq.com/s?__biz=MzIwMjM0NDM1Nw==&mid=2247484448&idx=1&sn=9056eabb455248d6399dd51f677c6c33&chksm=97b3df80f5eb878125f8f00efbb2489614abfbf88ebf77a7dd0894cfe0ea43a698d93ed28de8)。\n"}];
marked.setOptions({ gfm: true, breaks: true });
const listEl = document.getElementById('list');
const viewEl = document.getElementById('view');
const searchEl = document.getElementById('search');
let current = -1;

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function renderList(filter) {
  const f = (filter || '').trim().toLowerCase();
  listEl.innerHTML = '';
  ARTICLES.forEach((a, i) => {
    if (f && !a.title.toLowerCase().includes(f)) return;
    const item = document.createElement('div');
    item.className = 'item' + (i === current ? ' active' : '');
    item.innerHTML = '<div class="d">' + esc((a.date || '').replace('T', ' ').slice(0, 16)) + '</div>' +
                     '<div class="t">' + esc(a.title) + '</div>';
    item.onclick = () => show(i);
    listEl.appendChild(item);
  });
}

function show(i) {
  current = i;
  const a = ARTICLES[i];
  const srcLink = a.source ? '<a href="' + esc(a.source) + '" target="_blank" rel="noopener">微信原文</a>' : '';
  const mdLink = '<a href="content/posts/' + encodeURIComponent(a.file) + '" target="_blank" rel="noopener">打开 .md</a>';
  viewEl.innerHTML =
    '<h1>' + esc(a.title) + '</h1>' +
    '<div class="meta">' + esc((a.date || '').replace('T', ' ').slice(0, 16)) + '</div>' +
    '<div class="links">' + srcLink + mdLink + '</div><hr>' +
    '<article>' + marked.parse(a.md) + '</article>';
  document.querySelectorAll('nav .item').forEach(el => el.classList.remove('active'));
  renderList(searchEl.value);
  viewEl.parentElement.scrollTop = 0;
}

searchEl.addEventListener('input', () => renderList(searchEl.value));

// 默认打开第一篇（最新）
if (ARTICLES.length) { show(0); }
renderList('');
</script>
