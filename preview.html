<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>十方上学记 · 文章预览</title>
<style>
  :root {
    --bg: #ffffff; --bg-soft: #f6f7f9; --fg: #1f2328; --fg-dim: #6a737d;
    --line: #e4e7eb; --accent: #0969da; --active-bg: #eaf3fd;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --bg-soft: #161b22; --fg: #e6edf3; --fg-dim: #8b949e;
      --line: #30363d; --accent: #58a6ff; --active-bg: #1f2e3f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--fg); background: var(--bg); }
  header { position: fixed; top: 0; left: 0; right: 0; height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--bg); z-index: 10; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; white-space: nowrap; }
  header .count { color: var(--fg-dim); font-size: 12px; white-space: nowrap; }
  #search { flex: 1; max-width: 360px; margin-left: auto; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg-soft); color: var(--fg); font-size: 13px; outline: none; }
  #search:focus { border-color: var(--accent); }
  nav { position: fixed; top: 52px; bottom: 0; left: 0; width: 300px; overflow-y: auto; border-right: 1px solid var(--line); background: var(--bg-soft); padding: 8px; }
  nav .item { padding: 8px 10px; border-radius: 8px; cursor: pointer; }
  nav .item:hover { background: var(--active-bg); }
  nav .item.active { background: var(--active-bg); }
  nav .item .d { font-size: 11px; color: var(--fg-dim); }
  nav .item .t { font-size: 13px; line-height: 1.45; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  main { position: fixed; top: 52px; bottom: 0; left: 300px; right: 0; overflow-y: auto; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 36px 28px 80px; }
  .meta { color: var(--fg-dim); font-size: 13px; margin-bottom: 4px; }
  .links { margin: 6px 0 0; font-size: 13px; }
  .links a { color: var(--accent); text-decoration: none; margin-right: 14px; }
  article { line-height: 1.85; font-size: 16px; }
  article img { max-width: 100%; height: auto; border-radius: 6px; }
  article h1, article h2, article h3 { line-height: 1.4; }
  article blockquote { margin: 1em 0; padding: 2px 14px; border-left: 3px solid var(--accent); background: var(--bg-soft); border-radius: 0 6px 6px 0; color: var(--fg-dim); }
  article hr { border: none; border-top: 1px solid var(--line); margin: 2em 0; }
  article a { color: var(--accent); }
  article code { background: var(--bg-soft); padding: 1px 5px; border-radius: 4px; font-size: 90%; }
  .placeholder { color: var(--fg-dim); text-align: center; margin-top: 30vh; }
  @media (max-width: 900px) {
    nav { width: 240px; }
    main { left: 240px; }
  }
</style>
</head>
<body>
<header>
  <h1>十方上学记</h1>
  <span class="count">共 13 篇 · 内容与 content/posts/ 实时同步</span>
  <input id="search" type="search" placeholder="搜索文章标题…">
</header>
<nav id="list"></nav>
<main><div class="wrap" id="view"><div class="placeholder">← 从左侧选择一篇文章</div></div></main>

<script>
const ARTICLES = [{"file": "十方上学记｜直面强者！篮球赛对阵年级最强班，虽败不馁.md", "title": "十方上学记｜直面强者！篮球赛对阵年级最强班，虽败不馁", "date": "2026-11-24T18:48:00+08:00", "source": "https://mp.weixin.qq.com/s/weiSWIryJJRBBxpQ1OAHlg", "md": "\n今天是星期一，新的一周开始啦。\n\n早上还是老样子，按时到学校。到班先语文早读，接着是第一节语文课。我把话筒架送到大操场，回到班里站好队，参加升旗仪式，流程和平时一样。 升旗仪式结束，继续上第二节课、第三节课，第四节课是足球课。足球老师先让我们站了大概十到二十分钟，然后练习运球。练了十分钟左右，老师让我们自由活动，我们自发组队踢比赛，我也上场了。比赛的时候，对方队伍总把球踢出场外，我们不停捡球、发球。下课之后，大家一起走回教室。\n\n回到班里，吃饭、午休，然后上下午第一节课 —— 音乐课。课上到一半，英语老师过来把我和几个同学喊走，叫我们帮忙检查作业。英语老师先跟我们讲清楚检查的要求，我们就开始干活。我先检查了几本练习册，很快就下课了，我们赶紧回班复习。下一节语文课，老师讲练习册，之后布置作业。 我们几个帮忙检查作业的同学，又被老师叫过去继续检查，一直查到下课。\n\n下课之后，菲菲和妍妍去上社团课了。我跟英语老师说不想上社团课，老师帮我给社团老师打电话请假，让我留下来。和我一起留下的还有四三班的肖哥，以及我们班的 Lucky。 英语老师没有让我们在四三班干活，带我们去了一个神秘地方 —— 以前校长聊天的房间，这个地方我见过，很熟悉。我们三个坐下来接着检查作业，我先把英语练习册检查完，老师又拿了作业本给我。我检查了几本作业本，社团课就结束了。\n\n原本接下来是英语老师的作业辅导小课，但是老师要去负责篮球比赛，辅导课不上了。我从那个房间回到班里，记下今天的作业，然后站队去篮球场看篮球比赛。 我们先确认参赛队员，不是运动员的就在边上观看，队员上场比赛。\n\n我们班对战四三班，四三班可是四年级最强的班。比赛刚开始不到五分钟，四三班就先进一球。我们努力追赶，快到尾声的时候，老师派我上场打一会儿。 上场的时候我还穿着外套，对面拿到球的是诺诺，我和她关系很好，她是四三班实力第二的选手，连小艺都撞不动她。我追上她，把球拦下来，传给我们班同学。拉扯的时候我们俩一起摔倒了，好在球顺利传出去了。之后小雨投进一球，最后比分定格在 18:2，四三班赢了。 以前我们班打球输了，队员都会哭，今天大家都没哭，不知道是太累了，还是哭不出来，只有小曹哭了。 打完比赛，我们去吃晚饭，之后上晚自习，然后放学回家。\n\n---\n\n> 本文首发于微信公众号「辰爸学育儿」，[查看原文](https://mp.weixin.qq.com/s/weiSWIryJJRBBxpQ1OAHlg)。\n"}, {"file": "十方上学记｜小学四年级读完 160 万字小说！4 个月沉浸式看完.md", "title": "十方上学记｜小学四年级读完 160 万字小说！4 个月沉浸式看完", "date": "2026-11-23T18:48:00+08:00", "source": "https://mp.weixin.qq.com/s/sUcF0HPRReh39lPjZLwypA", "md": "\n今天是星期日，我花了 4 个月，终于看完一本 160 万字的长篇小说！我今年才上四年级。去年我的总阅读量是 500 万字，今年这本就差不多占了去年的五分之二。 这本书是徐公子胜治写的，叫《神游》。主角叫石野，他天生有阴眼，可以看见别人看不见的东西。有一位金爷爷帮他封住血脉，给他易筋洗髓。等到石野上高一的时候，风君子解开了他的阴眼，还教他丹道，后面就讲他修行丹道一路上遇到的各种故事。 书里有几件我印象很深的大事：\n\n1. 他们一起救下了阴神柳依依；\n2. 石野后来娶了自己的高中班主任柳菲儿老师；\n3. 风君子斩杀了修行人七叶。因为七叶宁愿在猴群里当猴王，也不愿意好好做人，他修行不是为了成仙，只想拥有神通，在人群里称王称霸；\n4. 石野追杀付接，一路从哈萨克斯坦追到浙江，最后杀掉付接，后来才知道，付接是他的亲舅舅；\n5. 石野查清了自己亲生父母的身世，知道自己是梅氏禁地传人，本来不姓石，姓梅；\n6. 东西昆仑爆发大战。最后两大昆仑的盟主坐下来协商，达成约定：两昆仑可以互通往来，但所有人都要遵守修行人的三大戒律。 这本书真的特别好看，我看得特别沉迷，有一天一口气看了七八个小时，连游戏都忘了打。\n\n今天日常的事情不算多。早上我在老家起床，都九点多了。先刷牙，然后吃早饭。吃完早饭我们准备回郑州。我拿着我那根木棍玩，看着爸爸妈妈收拾东西。大概整理十分钟，我们就上车出发。 爸爸先开市区路段，上高速之后换妈妈开。下高速之后，市区又换回爸爸开。回到郑州，我们先把四妞和爷爷送到老哥家，再带着奶奶回我们家。路过菜地的时候，奶奶下车摘菜，我们先回家。 到家我换衣服、上厕所，紧接着赶去武术课。今天稍微迟到了一点，不过没关系。这节课是专门给我安排的补课，原本是 12 点的课，因为回老家错过了，教练让我两点过来。 上课先跑步，打三路长拳。打完教练让我休息，我喝了一杯水继续上课。后半节课专门练侧空翻，我一直翻不好，很难翻起来。下课之后我的腿一直在抖，和上次上完课一样。 武术课结束回到家，我先玩了一会儿游戏，又看了 20 分钟书，然后和妈妈下楼打乒乓球。下楼碰到上次那个小男孩，他正在和别人打球，喊我过去跟他打几局。我说我们要去另一边打，他也没有多说什么。我和妈妈在那边打了大概一小时。等他们打完，我们换到他那边场地，又打了十分钟，小男孩又过来找我对战。 今天他没有那么讨人厌，只是状态不太好，老是失误。打完球我们上楼回家。 到家之后我抓紧写作业，写了十分钟，妈妈喊我吃饭。吃完饭继续写作业。全部写完，洗澡、刷牙，准备睡觉啦。\n\n---\n\n> 本文首发于微信公众号「辰爸学育儿」，[查看原文](https://mp.weixin.qq.com/s/sUcF0HPRReh39lPjZLwypA)。\n"}, {"file": "十方上学记｜回老家历险记！我做了一根会耍出残影的木棍.md", "title": "十方上学记｜回老家历险记！我做了一根会耍出残影的木棍", "date": "2026-11-22T18:09:30+08:00", "source": "https://mp.weixin.qq.com/s/OlD6C4pX9J2ioTNeEjHmqA", "md": "\n今天是星期六，我跟着老爸回老家了。\n\n在老家，我还特意削了一根木棍。事情是这样的：下午我们觉得无聊，就出门玩，刚好明明也在，我们就一起去河边。路上有一处要过河，老爸一步跨过去，我跟着跳，一脚踩进泥里，差点滑倒。明明和妈妈说跳不过来，老爸就搬来一块大木头当垫脚石。明明牵着老爸的手，轻轻松松就过来了。轮到妈妈，她一脚踩上去，垫脚石滑了，脚直接踩进水里，裤脚湿了一小截，还好水不深。 妈妈说要赶紧回家换裤子鞋子，老爸就带着我们一起往回走，还特意走了一条小路。走着走着，我们到了漫水桥。以前我和老哥还在这里光着脚洗过车呢！我和明明提议在漫水桥玩一会儿。 明明手里拿了一根木棍玩水，我没有，就自己去找。老爸看见了，帮我挑了一根粗的，我丢掉细的，拿着粗棍子一起玩。我们玩了大概五分钟，就策马奔腾地跑回家啦。\n\n到家之后，明明准备回家，可是他不敢走，路上有两只狗，想让我陪他。其实我也怕狗，但是我手里有这根粗木棍！我们没有走那条有狗的路，绕了远路。我把他送到岔路口，就自己往回走。这次我走了那条有狗的路，看见狗的时候，我的心砰砰直跳。其中一只狗直直盯着我，看得我心慌，我直接拔腿就跑，使出了博尔特的速度！还好，我跑回了家，那条狗没有追上来。 到家没事干，我就在那儿等着。老爸说要烧火，我就和他一起生火，老爸一边烧火一边刷手机。火刚点着，明明又回来了，说干脆在我们家坐着等奶奶。等了一会儿，明明还是要回家，我就陪他去他家。到他家的时候，他奶奶回来了。明明本来想在家看电视，奶奶不让，没办法，他又骑车跟着我回我们家。\n\n回到家，老爸说我的木棍可以修整一下。我找出斧头来砍，怎么都砍不好，木头一头总裂开，越砍越短。最后我使出终极大招 —— 喊老爸帮忙！ 老爸说可以用锯子，让我去找。我翻了半天没找到，又叫老爸一起来找。锯子没找到，反倒翻出来一台切割机。老爸说切割机也能用，插上电开始切，切出来的断面比我劈的整齐多了，又平又光滑。 切好两头，下一步要剥树皮、粗打磨。我们到处找打磨的工具，我拿镰刀试了试，一点都不锋利。后来老爸找到一个我俩都不认识的工具，专门用来刮树皮。等爷爷回来才知道，这个东西叫刨子！ 老爸教我怎么用。他把木棍夹在腿中间，拿刨子往前推，刨下来好多卷曲的木屑。他示范完，换我试试。我上手试了试，还行，就是刮得有点粗糙。我们俩轮流刨，刨了好久好久，终于做好了，木棍变成白白的一根，特别好看。 老爸说，下一步要用砂纸精细打磨，但是老家没有砂纸，只能先放着，等回家里拿砂纸再继续加工。 我拿着这根半成品木棍，和四妞一起玩跳远、跳高，还耍棍花，都耍出残影了！这根棍子就一个缺点：对我来说有点短，不过照样很好玩。\n\n---\n\n> 本文首发于微信公众号「辰爸学育儿」，[查看原文](https://mp.weixin.qq.com/s/OlD6C4pX9J2ioTNeEjHmqA)。\n"}, {"file": "十方上学记｜我的期中总分全班第一！家长会看浪浪山，还打了篮球.md", "title": "十方上学记｜我的期中总分全班第一！家长会看浪浪山，还打了篮球", "date": "2026-11-21T18:35:00+08:00", "source": "https://mp.weixin.qq.com/s/tlxMKIjeWAIXH3cE_gZcGA", "md": "\n今天是星期五。直到今天，我才知道自己期中考试各科成绩：语文 97.5 分，是班里第一名；数学 98 分，班里第二名；英语 100 分，科学 96 分，也是班里第一。我算了算，总分 391.5 分，也是全班最高分。\n\n今天早上，按照惯例，到学校先早读。然后上第一节、第二节、第三节、第四节课。下午有一件大事，要开期中家长会。\n\n下午先上了第一节课，本来接下来是班会课，因为家长要来开家长会，我们先去小操场集合，再统一去报告厅。先让家长们进到报告厅，我们在外面等了好久，终于轮到我们进去。到报告厅之后，老师说我们可以看电影，我们一下子欢呼雀跃，老师马上提醒我们安静，我立刻坐好。接着后台老师开始播放影片，看的是《浪浪山小妖怪》。\n\n老师们要回各班开家长会，没法在报告厅陪着我们，陆老师安排了综合组的老师看管我们。电影看到一半，大部分同学被老师带走了。我和小橙子留下来，因为我们是大队委，陆老师安排我们整理座套、捡垃圾。我捡了大概五分钟，跟陆老师说清理好了，陆老师笑着让我回班级。\n\n我和小橙子一路狂奔回教室，一眼看见老爸站在前面，不知道在忙什么。我先拿上书包，问老爸在干嘛。老爸说等老师忙完，他要和老师聊几句，让我先出去玩。我把书包和羽绒服放在教室，跑去操场和同学打篮球。一起出去的还有臭猪，我们找到阿宇、然然、小曹和耗子。\n\n我们先分队，我、然然、臭猪一队，他们三个一队。打了一会儿，老爸过来喊我回家，我说想再打一会儿，老爸就站在旁边看手机等着。打球的时候阿宇先走了，我们重新分队：我、小曹、臭猪一队，然然和耗子一队。我们才打进一个球，我就要去上英语课了，只好和大家告别。之前和然然一队的时候，我投进了一个两分球，我特意告诉了老爸。\n\n之后我坐老爸的车回家上英语课。路上老爸跟我说，明天要回老家，我一下子就不开心了。我问为什么要回去，老爸说没有特别的原因。我又问游戏什么时候玩、武术课怎么办。老爸说今天写完作业可以玩游戏，武术课在周日上午，路上赶不过去，就上不了了。\n\n听完我还是有点难过，我很想去上武术课。但是我转念一想，我们已经很久没有周末出门了，这一两个月，要么是学校上示范课，要么在家上网课。趁着这次回老家兜兜风，好像也挺好的。\n\n---\n\n> 本文首发于微信公众号「辰爸学育儿」，[查看原文](https://mp.weixin.qq.com/s/tlxMKIjeWAIXH3cE_gZcGA)。\n"}, {"file": "十方上学记｜期中成绩出炉！语文全班第一，数学却被新同学超过了.md", "title": "十方上学记｜期中成绩出炉！语文全班第一，数学却被新同学超过了", "date": "2026-11-20T18:48:00+08:00", "source": "https://mp.weixin.qq.com/s?__biz=MzIwMjM0NDM1Nw==&mid=2247484491&idx=1&sn=f19db89715f85c78220e66f7f8362e28&chksm=97cc52d5ccc642760e5440798f708b7a7ee87cfe5f3e61ed922ea6cd61c09a97dea027e12a22", "md": "\n今天是星期四，期中考试成绩出来啦！我语文考了 97.5 分，是我们班的全班最高分。新转来的小艺考了 97 分，全班第二。我本来以为他没有那么厉害呢。 数学我考 98 分，他居然考了 99.5 分，比我还要高。英语我考 100 分，他也考了 100 分。科学的成绩，我们现在还都不知道。\n\n接下来讲讲今天发生的事。早上还是老样子，到教室之后，我先问小艺早读要做什么，小艺跟我说了，我马上抓紧开始。今天早读是李老师的，李老师让我们先把以前的数学概念背完，等下她要画新的概念。我早就把旧的背完了，就在那儿等着。李老师嘴上说不想给我们画太多，结果一画就是四五页。我嘞个乖乖，这简直要我小命！一页上面就有好几处要背，四五页下来，我都要上天了。画完概念我赶紧狂背，才背了两页，还剩三页，早读就下课了。\n\n第一节是数学课，李老师往后讲新课啦。这几周一直在复习，好久没有往后上新内容了，终于等到了。上完这节课，轮到我们班站队。我刚走到外面，就听见四三班的优优说，大队委要一起去拍照。我赶紧通知我们班的大队委，回去拿上臂章、戴好红领巾，准备去拍照。 结果到了现场，老师没有直接拍照，先跟我们说了一段话，然后说今天不拍了。我有点纳闷，猜想可能是服装的问题，今天我们是自由着装，要等到周一所有人都穿上冲锋衣外套再来拍。 听完通知，我马上跑到大操场和班里同学一起做操。我本来是站前面做操的，结果被阿琪拦住了。他说刘老师交代，大队委要站后面做操，不然容易挡住前面的同学。我只好站到后面去。\n\n做完操是英语课，开开心心上完，然后就是我有点头疼的美术课。美术老师这节课让我们画机械动物。一开始我不太想画，但是待着又无聊，就跟着画了。我画了一条机械鱼。我知道我画画水平超烂，以前画的东西连我自己都认不出来，但是这次画得还可以，至少我能接受。画完上交，刚好下课。\n\n之后是语文课，上完课就去吃饭、午休。我午休去晚了一点，因为要检查卫生。我飞快把卫生检查完，赶去小操场，我们二楼要在这里做疏散演练。听完演练要求，我们就回寝室睡觉了。\n\n午休结束，下午第一节课是信息科技课，就是学怎么用电脑的课，我们全班都很喜欢。上课的时候老师也比较轻松，大多时候就在后排看着我们。 信息课上完又是数学课，李老师先布置了几项任务，做完就可以写作业。我刷刷几下就全部做完，开始写作业。写了大概 15 分钟下课，我课间也接着写，一直写到预备铃响才停下。\n\n之后我拿着语文作业跑去编程教室写作业，编程教室和电脑教室是同一个地方，用的软件也一样。到教室老师问我怎么来晚了，我找了个借口，说老师安排我盯错题所以耽搁了，老师也没有多问。 我旁边坐的是阿宇，他跟我想法一样，也带了作业过来。不过他是会写但是不敢写，我是敢写但是不会写。我俩一节课笔都没动，乖乖听课，作业一点没写成。\n\n这节课结束就是小课。小课上，我把语文作业写了差不多一半。然后照常吃饭、打扫卫生，去四三班上晚自习。 晚自习开始大概十分钟，我就写完语文作业，接着写家庭作业，家庭作业也在课间写完了。第二节晚自习我就看书，看了大概 6 页就下课了。我本来想赶紧收拾书包站队回家，刘老师又叫住我，让我把一份表格送到赵主任那里。我立马百米冲刺送过去，送完往回走。 我刚回来收拾东西，四一班的庞老师问刘老师表格送没送，刘老师说已经让我送去了。庞老师又把我喊过去，让我再送一份，这次送完不用回来，直接背着书包在那边等队伍。我背着书包跑过去，刚到那儿，队伍刚好到了，我马上跟上，放学回家啦。\n\n---\n\n> 本文首发于微信公众号「辰爸学育儿」，[查看原文](https://mp.weixin.qq.com/s?__biz=MzIwMjM0NDM1Nw==&mid=2247484491&idx=1&sn=f19db89715f85c78220e66f7f8362e28&chksm=97cc52d5ccc642760e5440798f708b7a7ee87cfe5f3e61ed922ea6cd61c09a97dea027e12a22)。\n"}, {"file": "十方上学记｜同学捡走我揉烂的废纸，粘好写了一句话送给我.md", "title": "十方上学记｜同学捡走我揉烂的废纸，粘好写了一句话送给我", "date": "2026-11-19T18:38:00+08:00", "source": "https://mp.weixin.qq.com/s?__biz=MzIwMjM0NDM1Nw==&mid=2247484486&idx=1&sn=3c76e1502414a76a3890081404a99947&chksm=97bf1c0a2f7aed6daf2461f7c3678d9978f20665ee316fe545113028ad264d9a6c2570494ce0", "md": "\n今天是星期三，我们班有个同学叫小曹，他做了一件事，特别让我感动。\n\n事情是中午开始的。吃完饭，李老师布置了课堂作业。里面有一道题不算难，就是有点麻烦。我写完先交给李老师，老师一看，说这道题写错了。我拿回去改，结果又改错了。中午时间不够，我只好先放着。\n\n到下午李老师的小课，我又拿着这道题去找她批改，还是错。李老师跟我讲了怎么订正，我改完再去，依旧不对。看我改了好多次都不对，李老师就把这道题所在的那一页撕下来，让我重新写。我照着要求重写，还是有地方出错。\n\n回到座位上，我气得把那张撕下来的纸狠狠撕碎，揉成一团丢进垃圾桶。这一幕刚好被小曹看见了，他让我把纸拿给他，我没理他。后来小曹又叫阿琪帮他把纸拿过去。我当时心里还嘀咕：小曹不会是捡破烂捡多了吧，连废纸都要？那时候我根本想不到，晚自习会有惊喜。\n\n第一节晚自习过半，我借着放多余三本书的机会回到座位，往抽屉里一看，一下子愣住了。抽屉里平平整整放着的，就是我撕碎揉烂的那张纸！碎纸被双面胶一点点粘好了。纸上还写着一行暖心的话：要接受错误，不要逃避，不用谢。后面画了一个笑脸和爱心。右下角还有一句：别再撕了，人生总有曲折。 下面还有署名：20161006 LXCJS44。\n\n![](static/images/2026-11/b0bf471fd54a9b0a.jpg)\n\n![](static/images/2026-11/72a22d40215c2e01.jpg)\n\n我赶紧拿到旁边仔细琢磨：2016 是 2016 年，10 是 10 月，06 是 6 日。LX 我不知道是什么意思，CJS 是小曹名字的首字母，44 就是我们四四班。我终于明白，是小曹捡走我扔掉的碎纸，粘好、写下话，悄悄放回我的桌斗里。那一刻我真的特别感动。\n\n我找小浩子撕了一小块作业纸，打算写纸条回送给小曹。巧的是，小浩子之前也被李老师撕过好几次作业。之后我借着上厕所的机会回到教室，把纸条放进小曹的抽屉。课间的时候，阿妍还帮我把纸条又修整了一下。这就是第一件让我很感动的事。\n\n中午在宿舍，还发生了另外一件事。我和小橙子在宿舍打闹，一路跑到外面走廊。臭猪突然跑过来拍了我一下，他没看路，一头撞到小橙子身上，把小橙子撞倒了。刚好磕在小橙子之前已经结痂的伤口上，这是第二次撞到同一个地方，伤口又流血了。\n\n这件事被李老师看见了。李老师先让臭猪给我道歉，问他为什么打我，臭猪自己也说不清楚。老师问他是不是故意的，他承认是故意的，我这边的事情就算翻篇了。 接下来处理小橙子受伤这件事。李老师让臭猪跟小橙子道歉，问小橙子能不能接受，小橙子说不接受。老师又问小橙子想怎么解决，小橙子说不想解决。李老师只好跟他说，等到下午再想方案。结果到了下午，小橙子也没有想出办法。\n\n说完这两件大事，再说说今天别的事情。 早上我照常来到学校，拿出拓展古诗背诵，最后全部背完了。早读下课，刘老师奖励最早背完古诗的三个人，每人一份小零食。第一名是小鲤鱼，第二名是我，第三名是家家。\n\n之后一节一节课往下上。下午有两节作文课，老师先讲解第六单元作文怎么写，然后我们开始动笔。这次作文要求介绍一处非物质文化遗产，要提前查资料。我选的是长城。我提前写好了草稿，搭好了框架： 第一段，点明我推荐的非遗； 第二段，写长城的申遗时间、长度，略写； 第三段，写长城外形特点，详写，这一段用中心句当关键句； 第四段，写长城的建造过程，详写，用过渡句开头； 第五段，写长城的历史变迁，略写。草稿里我本来打算详写这段，后来调整了，详写段落各占五行，略写四行，这段刚好四行，就定为略写； 第六段，原本计划写相关故事，最后删掉了。一是已经有一处略写段落，二是资料里有两个故事，我不想简单一笔带过，又没法写详细，干脆不写。结尾直接总结：长城真是一个伟大的工程呀！ 整篇是分总结构。我感觉这篇作文写得还行吧，一般般。写完上交，作文课就结束啦。\n\n---\n\n> 本文首发于微信公众号「辰爸学育儿」，[查看原文](https://mp.weixin.qq.com/s?__biz=MzIwMjM0NDM1Nw==&mid=2247484486&idx=1&sn=3c76e1502414a76a3890081404a99947&chksm=97bf1c0a2f7aed6daf2461f7c3678d9978f20665ee316fe545113028ad264d9a6c2570494ce0)。\n"}, {"file": "十方上学记｜一天考 4 门的期中考试，今天我像在打仗.md", "title": "十方上学记｜一天考 4 门的期中考试，今天我像在打仗", "date": "2026-11-18T18:50:00+08:00", "source": "https://mp.weixin.qq.com/s?__biz=MzIwMjM0NDM1Nw==&mid=2247484479&idx=1&sn=6f1e60937dc8f12c4ec2d27f0d59177a&chksm=976ba6c447bb5041c9ae3630c9cb6f7f2ef8e6a2e3861253ea9ac00b01b853aa51dd039f8d2d", "md": "\n今天是星期二，也是最重要的一天 —— 我们要期中考试。\n\n早上我还是和以往一样，坐车来到学校。刚到班里，我看见所有人都在复习，准备考试。\n\n第一场是语文，8:20 开考，10 点结束。监考老师差不多 8 点就来了，我们趴在桌上静息。8:10 哨声响起，老师开始发卷子。我拿到卷子，先写上姓名和班级，然后先看作文。这次作文是之前第四单元的题目改的，原本是半命题《我和谁过一天》，这次改成命题作文：当我推开这扇门。题目要求是我去到他的世界，不是他来到我的世界。\n\n我大概看了看作文要求，接着看别的题目，才看两道题就吹哨了，我赶紧拿起笔刷刷开写。 第一题看拼音写词语，第二题选择题，第三题有两个小题：一个是用两个词语造句，另一个是读到词语想象画面。第四大题课文默写，第五大题阅读理解，一共两篇，一篇是米兰冬奥会，另一篇讲蟋蟀。\n\n基础题写着写着，我突然想上大号，就举手跟老师报告。老师同意了，我拿着纸跑去厕所，只用了 5 分钟，打破了我自己的纪录！回来继续埋头写。 我记着单元习作原本写的是他来我的世界，读懂题目后，我稍微改了改，写成我去到他的世界。写完作文我数了下，大概 467 个字，要求是 350 字左右，写得有点多啦。\n\n考完语文，我跑去问小浩子：作文写的是他来我的世界，还是我去他的世界？ 他说写的是他来我的世界。我赶紧提醒他写错了，题目是我去他的世界，他一下子就慌了。后来他跑去问老师，老师说两种写法都可以，他这才松了一口气。\n\n离英语考试还有 20 分钟，监考老师走进教室。没想到监考的居然是我们一年级的数学何老师！ 10:25，何老师发卷子让我们先看题，10:30 吹哨正式开考。英语有听力，何老师先播放听力，听完再做笔试。英语是我的强项，我大概 20 分钟就写完了。\n\n英语考完就到午饭时间。吃完午饭，大家都拿出书本，抓紧复习下午的科目。下午先考数学，再考科学：数学 2:30–4:00，科学 4:20–5:00。 科学是我的薄弱项，我先复习科学，复习完再翻数学课本。刚复习一个单元，老师就让我们出去站队，下楼玩一会儿，之后回寝室午休。 今天我们都很乖，乖乖躺好。我睡了一小会儿就醒了，躺在那里闭目养神。午休结束，排队回教室。\n\n数学开始考试：第一题填空，第二题选择，第三题计算，第四题画图操作，第五题应用题，有些应用题还是课本上原题。卷子正反两面，题目不多，我大概 25 分钟就写完了。考完数学一下子轻松了，只剩下最后一门科学。\n\n我去上了个厕所，回来准备科学考试。科学卷子：选择题、填空题、连线填图题，还有三篇阅读理解。我只用 15 分钟写完，但是有一道题卡了很久：\n\n> 关于地心说和日心说，下列说法不正确的是？\n>\n>  A. 二者的共同观点是地球是球体\n>\n> B. 二者都可以看见太阳东升西落\n>\n> C. 日心说的观点直至今日依然完全正确\n\n我琢磨半天，感觉选项都对，最后胡乱蒙了 B。晚上我问豆包，才知道正确答案是 C。\n\n科学考完还有一节小课写作业。我先写完数学，语文写到一半，就到晚饭时间了。 今天晚饭是炒米和菜汤，味道一般。吃完饭打扫卫生，去四三班，接着上晚自习，之后放学回家。\n\n到家我还要写作业，我跟妈妈说：今天考了一整天试，能不能不写了？ 妈妈说，把古诗读一读、单词背完就可以睡觉。我完成这两项，洗完上床，大概十分钟就睡着了。\n\n---\n\n> 本文首发于微信公众号「辰爸学育儿」，[查看原文](https://mp.weixin.qq.com/s?__biz=MzIwMjM0NDM1Nw==&mid=2247484479&idx=1&sn=6f1e60937dc8f12c4ec2d27f0d59177a&chksm=976ba6c447bb5041c9ae3630c9cb6f7f2ef8e6a2e3861253ea9ac00b01b853aa51dd039f8d2d)。\n"}, {"file": "十方上学记｜同学悄悄跟我说，足球课新来的教练很凶.md", "title": "十方上学记｜同学悄悄跟我说，足球课新来的教练很凶", "date": "2026-11-17T18:36:00+08:00", "source": "https://mp.weixin.qq.com/s?__biz=MzIwMjM0NDM1Nw==&mid=2247484472&idx=1&sn=a7563d6a177032fddc56fa312041a1fe&chksm=978642846edf00d6b10eeb6677807fc016df49a2fabb2a93c7761d58bbf4e81bbd5b66faf945", "md": "\n今天是星期一。 早晨我从床上爬起来，感觉胳膊腿哪哪都是酸的，应该是昨天运动过量了，尤其是练武术、练空翻，腿特别酸。 我 7 点起床，我们上学要在 7:50 之前到校。起床吃完早饭，穿好衣服，背上书包，坐爸爸的车去学校。到学校先早读，今天是语文早读，老师让我们往后多背一首拓展古诗，我一口气背了两首，因为上一周我就已经背会了。\n\n早读下课，我负责收作业。好不容易把作业收齐放到后面，马上又要上课了。我赶紧做好课前准备，开始上语文课。这节课复习作文，马上要期中考试了，明天就考！上午考语文、英语，下午考数学和科学。\n\n第一节课上完，本来要去操场升国旗，但是今天下雨，升旗仪式改成在班里进行。老师布置了一张试卷，让我们课间写完。没有升国旗，班里大部分同学都在奋笔疾书，只有少数人在玩。 老师看手机的时候，还跟我们说了两件事：一个是祭祖相关活动，还有我们校长杯足球赛拿了亚军。老师安排小橙子和小宇去领足球比赛的奖状，派我去拿流动红旗。 我们从二楼狂奔到一楼，路过加餐室的时候，加餐老师一把拽住我的手腕，让我帮忙领加餐送到楼上。老师跟我熟，也没客气，直接把加餐筐塞我手里。我只好先跑回二楼把加餐放教室，再跑下楼去德育处拿流动红旗，拿到之后又跑回二楼交给老师。 等我忙完，刚写了两道题，数学课就开始了。数学课平平无奇，紧接着是英语课。我们全班都很喜欢英语课，因为英语老师特别幽默风趣，上完感觉特别舒服。\n\n第四节课是足球课。我们本来的邓教练没来，门口站着一位年纪和邓教练差不多的教练。我上去一问，他说邓教练家里有事，这几节课由他来代，他姓马，是马教练。马教练看起来很凶，不喜欢上课的时候有人捣乱。 上课先绕大操场跑一圈，然后运球，运了大概十分钟。之后马教练带我们玩 “耍猴” 游戏。规则就是四个人围成一圈传球，中间一个人抢球，抢到球的话，刚才最后碰到球的人就要去中间抢。不过马教练改了玩法：我们用手拿着足球玩，中间两个人抢，外圈四个人传，我们玩得不亦乐乎。 玩着玩着就下课了，我们小跑回教室准备吃午饭。今天中午的饭全是素菜，一点肉都没有，我不太想吃。\n\n吃完饭，我先去上厕所，回来继续狂飙试卷。写了一会儿，老师喊我去订正错题，改完之后我接着写，大概又写了 15 到 20 分钟，就到站队时间了。 我们分三组轮流值日，今天第一组值日，我们剩下的组到走廊排队，准备回宿舍午休。队伍排好，老师带我们去宿舍。 到宿舍，大家先聊了一会儿天，聊的是《三角洲》，最近班里好多同学都在玩这个游戏。哨声响了，该睡觉了，我们还在小声聊。老师过来提醒我们赶紧睡觉，我们央求：“再聊最后一句！” 老师同意了。 等我们聊完，老师又走进来，问我们想不想吃酱。我们都说想。老师说：“那你们好好表现，拿到宿舍流动红旗，下周一就能吃到酱。” 我们一下子反应过来：原来拿酱 = 拿流动红旗！听完这话，宿舍里大家不约而同安安静静，乖乖准备睡觉。 我躺在床上翻来覆去，找到一个舒服的姿势，很快睡着了。我们 1 点午休，2 点起床，我大概 1:50 就醒了，悄悄把衣服穿好等着。哨声一响，我下床站队，跟着老师回到教室。\n\n下午第一节课是音乐课，苗老师上课。苗老师本来是教舞蹈的，音乐和舞蹈老师经常两边都带。苗老师先带我们练了几个高音，再学新内容。 音乐课结束，下一节是道法课。但我们的道法课基本都用来讲语文，到现在道法书才讲到第 6 页。今天也一样，老师先问谁写完试卷了，全班写完的不到 5 个人，然后发纸让我们默写多音字。这节语文课有点煎熬。\n\n之后是社团课，我选的是编程社团。我们用 Scratch 做编程，小学部没有计算机教室，要去中学部上课。刘老师先讲今天的任务，然后让我们自己动手做。我照着例子做了一个，效果还不错。 下课铃一响，编程社团的同学们飞快冲出教室往各班跑，我慢悠悠走回去。刚到班里，小浩子拉住我，跟我说马教练体罚学生。我心里一惊，问他怎么回事。他说男生们动作没做好，教练就让他们绕操场跑一圈。我听完笑了笑，回到座位上。\n\n再上一节辅导课，就放学了。要上晚自习的同学先去吃饭，我跟着一起去，晚饭还不错，终于有荤菜了。吃完饭回教室打扫卫生，我选了扫地。扫完我收拾东西，去四三班上晚自习。 我们三班和四班合并上晚自习，这个学期固定在三班教室。今晚的辅导老师是我们最喜欢的英语老师。晚自习分成两个小课。 第一个小课自主写作业，我的英语作业早就写完了，语文和数学主要是复习。我先把家庭作业写完，然后看我订的《阳光少年报》，刚好看到第一节结束。 休息十分钟，开始第二个小课。英语老师带着我们复习第一、二单元单词，你说英文我说中文，或者你说中文我说英文，轮流提问。 复习完就放学了，今天下雨，需要家长进校接。老爸已经在四三班门口等我，我收好东西跟着爸爸坐车回家。到家，妈妈正在做面条，味道还行。\n\n吃完晚饭，我回房间写作业。妈妈让我先订正数学错题，不会的题可以看看答案。我靠着答案做出一道，剩下两道还是不会。妈妈让我先上外教课，她来帮我研究题目。 等我上完外教课，妈妈也没想出来怎么做，就让我上床睡觉。我躺在床上，没多久就睡着了。\n\n---\n\n> 本文首发于微信公众号「辰爸学育儿」，[查看原文](https://mp.weixin.qq.com/s?__biz=MzIwMjM0NDM1Nw==&mid=2247484472&idx=1&sn=a7563d6a177032fddc56fa312041a1fe&chksm=978642846edf00d6b10eeb6677807fc016df49a2fabb2a93c7761d58bbf4e81bbd5b66faf945)。\n"}, {"file": "十方上学记｜口述上学之外的一天：武术、黑神话、乒乓球，忙到停不下来.md", "title": "十方上学记｜口述上学之外的一天：武术、黑神话、乒乓球，忙到停不下来", "date": "2026-11-16T18:31:00+08:00", "source": "https://mp.weixin.qq.com/s?__biz=MzIwMjM0NDM1Nw==&mid=2247484466&idx=1&sn=a45717b9fdb0c73ad9c50fb6bf21a2a9&chksm=971844f31a030ef3e882b052d78038f677cc684d20c0a2f887ad1bee0d4ae690ef99d3d98aa3", "md": "\n今天是星期日。 早上我 6 点多醒了一次，之后又睡着了。7 点多又醒一次，又睡着了。8 点多再醒，这次就没有睡着。起床之后我看了一会儿书。 看了一阵子，老妈喊我吃饭，今天吃土豆饼，还挺好吃的。我边看边吃，吃到 9:40，老妈催我，说 10 点有课。我跟她说，我有点想拉屎。然后我上完厕所、刷完牙，穿好衣服去上武术课。\n\n上武术课的时候，我们先跑几圈，然后练习撑腰，练完撑腰打了几遍连环拳，接着又撑腰，撑完腰就课间休息。休息大概 5 分钟，我喝了一杯水，就回到教室。 第二节课我们练侧手翻。一共三个人，另外两个人练不用助跑的侧手翻，我练侧空翻。有好几次我都快成功了，可是手会有生理反应，忍不住往下摁。教练说：“不要往下摁，忍住。” 可我就是忍不住。有一次我忍住了，结果摔倒了。 然后教练给我放了一个脚把，让我踩在脚板上翻。垫子本来就挺高，再加一个脚板，就更高了。我在脚板上练习，有一次克制住了，终于成功了一次！教练还拍了视频，发给我老妈。\n\n武术课结束，我回到家，开始玩《黑神话：悟空》，玩到浮屠界那里。 浮屠界真的很折磨人！一进土地庙再出来，就会变成红眼状态。红眼状态下，怪物和我的血量都会变低，但是攻击力高很多，就看谁技术更好。 我玩的是别人分享的存档，这个存档装备已经练到 149 级，很强。别人把存档发到网上，我让老爸导入到我的电脑里。存档有好多种：百分百通关存档、0 周目、9 周目、2 周目的。我选的是 0 周目，一棒子就能敲死怪物。 浮屠界恶心的不是怪物，是地图太绕了，看得头晕。我转好几圈都找不到路，好几次直接掉下去。浮屠界没有空气墙，掉下去就直接死掉。我穿着行者套，一路快跑，想快点通关。打完浮屠界的 BOSS，我就出来了，现在玩到第三章，找到猪八戒之后，一小时的游戏时间也到了。\n\n玩完游戏，吃午饭。中午是老妈亲手擀的面条，味道还不错。 吃完饭我开始狂写作业，先啃两项：阅读笔记，要写读书感想；还有数学半张试卷。写完这两项，我跟妈妈说写不动了，她就让我先停下来休息。 我把桌子收拾好，去找爸爸妈妈，他们在客厅。我跟他们说想看小品，老爸就在电视上打开央视频，找《喜人奇妙夜》，但是要会员，只能看 5 分钟，广告还特别多。 我不想看广告，老爸就打开电脑，电脑连着电视。他在电脑上打开油管，找到了《喜人奇妙夜》，我们看了大概一个小时。\n\n之后老妈又叫我写作业，我说写不动了，跟她提议想去打乒乓球。打乒乓球是我的另一个爱好。妈妈同意了，我穿好衣服，拿上球拍和球，准备和她下楼打球。老爸也换上衣服，说要下楼散步。 当时已经 6 点多，天黑了。我跟妈妈说，我也想散步，她同意了。我们下楼走了几圈，才去打球。散步的时候，我们买了一杯蜜雪冰城的高山四季茶，然后去负一层的乒乓球室。 负一层环境还可以。昨天有个小孩在墙角撒尿，妈妈叫管家过来清理了。今天我特意过去闻了闻，没有尿味了。我们安安静静打球。\n\n打了大概一小时，我们都累了，准备回家。旁边另一张球桌，有一位叔叔和一个小朋友在打球。那个小朋友握拍姿势是错的，不过叔叔打得不错。 叔叔看见我站在旁边看，就喊我过去跟他打一会儿。他水平不算特别厉害，但是旋转很强，发球都是侧旋，后手一抖又变成下旋。这种下旋球不能正常接，一接就容易下网，所以我用搓球应对。我搓过去的球比他的还转，叔叔连连失误。远台我就用削球。 叔叔问我是不是专门学过，我说暑假学过两个月。叔叔夸我打得很好。打完我们就告别了。\n\n回家之后，我继续狂飙作业，写了几十分钟，老妈喊我吃饭。老爸和妈妈都不吃，我吃的是早上剩下的土豆饼，本来是留到明天当早餐的，我想吃，老爸就让我吃了。 吃完土豆饼，我接着把剩下的作业全部写完。冲了个澡，然后就睡觉了。\n\n---\n\n> 本文首发于微信公众号「辰爸学育儿」，[查看原文](https://mp.weixin.qq.com/s?__biz=MzIwMjM0NDM1Nw==&mid=2247484466&idx=1&sn=a45717b9fdb0c73ad9c50fb6bf21a2a9&chksm=971844f31a030ef3e882b052d78038f677cc684d20c0a2f887ad1bee0d4ae690ef99d3d98aa3)。\n"}, {"file": "十方上学记｜三妞过生日，大人忙着点蜡烛，我们小孩只关心一件事.md", "title": "十方上学记｜三妞过生日，大人忙着点蜡烛，我们小孩只关心一件事", "date": "2026-11-15T18:40:00+08:00", "source": "https://mp.weixin.qq.com/s?__biz=MzIwMjM0NDM1Nw==&mid=2247484461&idx=1&sn=1f2d1e2588bcb917ab8c72c1d1777f49&chksm=97ff70e29141bdd7f33fcc1b0d8bd80d40ff24a5b34b54ccf5a0852e7505806057d61e483d8e", "md": "\n三妞是我堂妹，大伯家的女儿，11月17号生日，下周二。大人要上班，所以提前到今天过。\n\n今天上午我还在上学而思数学，11:50才放学。我爸接上我，先去超市买了三束小雏菊，说是给大娘、二妈和奶奶的。我在旁边看着，心想：花是挺好看，但今天的主角是三妞，你们大人怎么还给自己买上了。不过收到花的人确实都笑了，行吧，这钱花得不算冤。\n\n到了饭店，人已经齐了。四个小孩：大宝、我、三妞、四妞。大宝和四妞是爹爹家的，三妞是大伯家的，我是我爸家的。四妞才两岁，最小的那个，最可爱也最能捣乱。我们四个凑一块儿，饭店包间差点装不下。\n\n菜上来了，很丰盛。但我跟你说实话，桌上没几个人认真吃。大人追着喂，我们象征性地张嘴，嚼两下，咽了，然后继续等蛋糕。谁稀罕菜啊。现在的小孩什么没吃过，再好的菜，不如蛋糕上那层奶油有吸引力。\n\n大宝最先坐不住了，说“吃饱了”，跑去旁边玩卡片。我和三妞一看，也跟着跑了。三个人围着一包圆卡片，玩得比吃饭认真多了。四妞在旁边看着，手一伸，把卡片搅乱，我们仨同时“哎——”了一声，但没人敢凶她，两岁，惹不起。\n\n大人吃得差不多了，终于开始张罗点蜡烛。那个忙啊，找打火机的找打火机，关灯的关灯，摆蛋糕的摆蛋糕，还有人喊“帽子呢帽子呢”。我们四个小孩就站在旁边看着，等他们忙完。\n\n三妞戴着生日帽，闭眼睛许愿，吹蜡烛。那个瞬间我瞄了她一眼，她表情特别认真，不知道许的什么愿。我没问，问了就不灵了。\n\n蛋糕是6寸的，不大。我听大人说，以前买大的都吃不完，所以越买越小。我觉得挺有道理，反正我们小孩吃两口就腻了，剩下的全靠大人解决。现在的孩子什么都不稀罕？这话我不同意。我们稀罕，只是稀罕的东西跟你们不一样。你们稀罕菜，我们稀罕蛋糕上的草莓。你们稀罕热闹，我们稀罕吃完能去玩。\n\n最后大人让我们四个站一块儿拍照。三妞8岁，我10岁，大宝11岁，四妞2岁。排一排，高矮差一大截，四妞站中间，被我们仨夹着，一脸懵。照片拍出来，我看了，挺好看的。就是四妞没看镜头，她在看旁边什么东西，不知道。\n\n吃完之后，大伯大娘他们骑电动车先走了。最后是爹爹——大宝和四妞他爸——带我们四个去游乐场。三妞下午本来有书法课，过生日破例请假了，跟着我们一起疯。\n\n结果到了游乐场，没进去。票务问题。一个大人带四个小孩，最小的才两岁，订的票没有合适的。爹爹在那儿跟工作人员说了半天，我们四个在旁边站着等，四妞已经开始不耐烦了，拽着大宝的袖子晃。\n\n进不去就进不去吧。爹爹一挥手，改道去公园。喂鸽子。\n\n三妞喂得最起劲，四妞追着鸽子跑，鸽子被她追得满天飞，她还在下面笑。大宝在旁边站着，假装很酷，其实手里也捏着鸽子食。一个大人带四个小孩，爹爹今天挺不容易的，但他在旁边看着我们跑，也没催。\n\n我蹲在那儿喂了一会儿，看着三妞。她8岁了。\n\n8岁是什么概念呢，就是她再也不是那个随便给颗糖就能哄走的小屁孩了。她有自己的愿望了，吹蜡烛的时候许的那个愿，我没问，但我知道她肯定认真想了。\n\n希望她平安健康快乐长大。这个我同意。但我还想加一句：下次过生日，能不能别提前。当天过，我还能在学校跟同学说“我昨天吃蛋糕了”。提前过，等上学都没人信。\n\n---\n\n> 本文首发于微信公众号「辰爸学育儿」，[查看原文](https://mp.weixin.qq.com/s?__biz=MzIwMjM0NDM1Nw==&mid=2247484461&idx=1&sn=1f2d1e2588bcb917ab8c72c1d1777f49&chksm=97ff70e29141bdd7f33fcc1b0d8bd80d40ff24a5b34b54ccf5a0852e7505806057d61e483d8e)。\n"}, {"file": "十方上学记｜午睡时间，我们宿舍把被子玩出了花.md", "title": "十方上学记｜午睡时间，我们宿舍把被子玩出了花", "date": "2026-11-14T18:48:00+08:00", "source": "https://mp.weixin.qq.com/s?__biz=MzIwMjM0NDM1Nw==&mid=2247484457&idx=1&sn=7802629997d9bc805b16613d9e8452ca&chksm=97b3b5905a262f120bca9538a33c5e60f0f5fb2f138173a74c2d2fa5a1b3a604d98927de4b3b", "md": "\n我们学校中午是要午睡的。\n\n但我跟你讲，我们宿舍的中午，跟“睡”这个字关系不大。\n\n先说我们宿舍的配置。四张床，上下铺，我们几个都在上铺。一到午睡时间，老师一走，上铺就活了。\n\n枕头大战是入门项目。这个不用多解释，就是拿枕头抡。谁先动手不重要，重要的是最后所有人都被卷进来，枕头满天飞，打到后来枕头芯都歪了。\n\n进阶版是“抛人”。这个玩法我至今觉得离谱：四个人站上铺，一人揪住被子一个角，把被子扯成一个兜，然后让全宿舍最轻的那个躺进去。一二三，往上抛。接住，再抛。那个最轻的哥们儿躺在被兜里，表情又爽又慌，我们四个揪被角的累得手酸，但谁也不肯松手。\n\n今天中午玩的是第三个版本。\n\n我们把被子往上下铺两个床中间一搭，垂下来，正好当窗帘。一边一个人，隔着被子窗帘对打。你打过来，我打过去，看不见对方，全凭感觉。被子晃来晃去，人影在缝隙里一闪一闪的，跟打擂台似的。\n\n今天参与的有我、小朱、小林、浩子、小橙子、小榛子，还有小李。上铺挤了一排，被子扯得吱吱响，有人笑得从铺上往下出溜，被旁边人一把拽回来。小橙子隔着帘子乱挥，打到了小榛子，小榛子不服，绕到另一边偷袭，结果撞到浩子身上，俩人滚成一团。\n\n正闹着，走廊里传来脚步声。\n\n一瞬间，所有人定住。被子不动了，人也不动了。小橙子还保持着一个挥拳的姿势，僵在那儿。浩子小声说“别出声别出声”，声音小得跟蚊子似的。\n\n脚步声过去了。\n\n过了三秒，不知道谁先没憋住，笑了一声，然后全宿舍炸了，笑成一团。\n\n午睡铃响的时候，我们被子叠得整整齐齐，人躺得规规矩矩。老师进来转了一圈，满意地点了点头。\n\n她不知道的是，我们的被子里还藏着刚才那场大战的余温。枕头芯是歪的，被角是皱的，小橙子的头发到现在还翘着一撮。\n\n午睡？睡了，但主要是笑累了才睡着的。\n\n明天中午玩什么，我们还没商量好。但被子肯定还得遭殃。\n\n---\n\n> 本文首发于微信公众号「辰爸学育儿」，[查看原文](https://mp.weixin.qq.com/s?__biz=MzIwMjM0NDM1Nw==&mid=2247484457&idx=1&sn=7802629997d9bc805b16613d9e8452ca&chksm=97b3b5905a262f120bca9538a33c5e60f0f5fb2f138173a74c2d2fa5a1b3a604d98927de4b3b)。\n"}, {"file": "十方上学记｜武术课上到一半，校长喊我们去菜园吃烤红薯.md", "title": "十方上学记｜武术课上到一半，校长喊我们去菜园吃烤红薯", "date": "2026-11-13T07:22:59+08:00", "source": "https://mp.weixin.qq.com/s?__biz=MzIwMjM0NDM1Nw==&mid=2247484453&idx=1&sn=1efff0c06adff92fcae3160c8fe782c9&chksm=9793220d0344b4b38ba2d38e8a789702dd0457cd0947d7ded25192dfe7da3f861146aed64372", "md": "\n事情是这样的。\n\n今天我们在操场上武术课，正练着呢，卢老师走过来，跟童老师说了几句话。我没听清，但看童老师的表情，感觉不是什么坏事。\n\n然后童老师转过身，冲我们喊了一句：校长在小菜园挖红薯、烤红薯，让我们过去吃。\n\n武术课。烤红薯。这两个词放一块儿，我脑子短路了半秒。\n\n全班愣了一秒，然后炸了。有人已经开始跑了，被童老师喊回来排队。我们排着队往小菜园走，那队形，说整齐吧，也不太整齐，主要是每个人脸上都写着“快点走”。\n\n到了小菜园，校长真在那儿。旁边一堆红薯，刚从地里挖出来的，还带着泥。校长说，别光吃，先帮忙挖。\n\n行吧。吃之前先干活，这个道理我懂。\n\n我们蹲在地里挖红薯，那场面挺壮观。有人挖出来一个特别大的，举起来喊“看我这个”，有人挖了半天就挖出来一根手指头那么细的，还不服气，说这根不算。我挖了几个，手上全是泥，指甲缝里也是，但我居然觉得挺好玩的。比武术课好玩。这话别告诉童老师。\n\n挖完红薯，校长拿出一个炉子。就那种烤红薯的炉子，往那儿一摆，开始烤。我们围在旁边等，那个香味一点一点飘出来，我跟你讲，那是我今年闻过最香的味道。等的时候我数了一下，我们班好几个人在咽口水，包括我。\n\n红薯烤好了，校长给我们每个人分了一个。\n\n我拿到手，烫，左右手来回倒，一边吹一边剥皮。咬第一口的时候，我脑子里就一个想法：刚才那些泥没白挖。\n\n我们蹲在菜园边上吃红薯，没人说话，都在吃。平时班里最吵的那几个，那会儿也安静了。就那种，嘴里塞满了，顾不上说话。\n\n吃完我手上还是黑的，嘴边上也是。回教室的路上，我看了一圈，大家差不多都这德行，互相看着笑。\n\n那天武术课没上完。但我学会了一件事：红薯从地里到嘴里，中间隔着一堆泥和一段等待，但最后那一口，值。\n\n下次校长再烤，我还去。挖多少都行。\n\n---\n\n> 本文首发于微信公众号「辰爸学育儿」，[查看原文](https://mp.weixin.qq.com/s?__biz=MzIwMjM0NDM1Nw==&mid=2247484453&idx=1&sn=1efff0c06adff92fcae3160c8fe782c9&chksm=9793220d0344b4b38ba2d38e8a789702dd0457cd0947d7ded25192dfe7da3f861146aed64372)。\n"}, {"file": "十方上学记｜我们班有人被写了两个脏字，刘老师没查，讲了个故事.md", "title": "十方上学记｜我们班有人被写了两个脏字，刘老师没查，讲了个故事", "date": "2026-11-12T17:52:16+08:00", "source": "https://mp.weixin.qq.com/s?__biz=MzIwMjM0NDM1Nw==&mid=2247484448&idx=1&sn=9056eabb455248d6399dd51f677c6c33&chksm=97b3df80f5eb878125f8f00efbb2489614abfbf88ebf77a7dd0894cfe0ea43a698d93ed28de8", "md": "\n我们班有个同学，我管他叫小朱。\n\n小朱在班里不太招人待见，好多人烦他。说实话，我以前也不太跟他玩。他家里情况有点特殊，爸妈离了，妈妈又结了婚，他性格上跟别人不太一样，有时候怪怪的，有时候又让人不知道怎么接话。\n\n这天出事了。\n\n他的作业本封面上，不知道被谁写了两个字。很难听的两个脏字(sb)。小朱看到了，当场就哭了。他跑去跟老师说了，回家也跟他妈妈说了。\n\n他妈妈特别生气，直接在班级群里发了很长一段话，质问是谁写的，让写字的那个小朋友出来承认，还要求班主任给一个明确的答复。群里那气氛，我隔着屏幕都觉得紧张。\n\n刘老师不好做。真的不好做。一边是家长要说法，一边是班里这群十岁的小孩，查吧，伤感情，不查吧，交代不过去。\n\n第二天语文课，刘老师没上课。她说，今天我们不讲课文，我给你们讲个故事。\n\n她讲她以前带过一届学生。那届有个同学，拿了学校发的一笔激励奖金，放在书桌抽屉里，结果被偷了。刘老师也没安排全班搜查，也没一个个问。她就公开讲了这个事，说不管是谁拿的，一天之内，悄悄放回去，再写封道歉信，这事就算了。\n\n结果到了时间，钱真的回去了。抽屉里还多了一封道歉信。\n\n具体是谁，刘老师说不在乎。大家都还小，才四年级，谁还没个一念之差，谁还没个开玩笑开过头的时候。\n\n讲完这个故事，刘老师看着我们，说：这次在别人本子上写字的同学，周五放学前，写封道歉信，悄悄放到我讲台抽屉里。我不追究。\n\n后来周五过去了。具体有没有那封道歉信，是谁写的，我们也不知道。刘老师没说。\n\n但这件事我记了很久。\n\n我以前也觉得小朱烦。但那天看他哭，我突然觉得，如果那两个字写在我的本子上，我可能也会哭。刘老师没查，没骂，没揪人，但她说的话我好像听懂了。有些事不是查不出来，是查出来之后，那个被查出来的人，可能就再也抬不起头了。\n\n刘老师给的不是答案，是一个台阶。\n\n至于小朱，他还是那个小朱。但后来再有人拿他开玩笑，我会想起那两个字，然后就不笑了。\n\n---\n\n> 本文首发于微信公众号「辰爸学育儿」，[查看原文](https://mp.weixin.qq.com/s?__biz=MzIwMjM0NDM1Nw==&mid=2247484448&idx=1&sn=9056eabb455248d6399dd51f677c6c33&chksm=97b3df80f5eb878125f8f00efbb2489614abfbf88ebf77a7dd0894cfe0ea43a698d93ed28de8)。\n"}];
marked.setOptions({ gfm: true, breaks: true });
const listEl = document.getElementById('list');
const viewEl = document.getElementById('view');
const searchEl = document.getElementById('search');
let current = -1;

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function renderList(filter) {
  const f = (filter || '').trim().toLowerCase();
  listEl.innerHTML = '';
  ARTICLES.forEach((a, i) => {
    if (f && !a.title.toLowerCase().includes(f)) return;
    const item = document.createElement('div');
    item.className = 'item' + (i === current ? ' active' : '');
    item.innerHTML = '<div class="d">' + esc((a.date || '').replace('T', ' ').slice(0, 16)) + '</div>' +
                     '<div class="t">' + esc(a.title) + '</div>';
    item.onclick = () => show(i);
    listEl.appendChild(item);
  });
}

function show(i) {
  current = i;
  const a = ARTICLES[i];
  const srcLink = a.source ? '<a href="' + esc(a.source) + '" target="_blank" rel="noopener">微信原文</a>' : '';
  const mdLink = '<a href="content/posts/' + encodeURIComponent(a.file) + '" target="_blank" rel="noopener">打开 .md</a>';
  viewEl.innerHTML =
    '<h1>' + esc(a.title) + '</h1>' +
    '<div class="meta">' + esc((a.date || '').replace('T', ' ').slice(0, 16)) + '</div>' +
    '<div class="links">' + srcLink + mdLink + '</div><hr>' +
    '<article>' + marked.parse(a.md) + '</article>';
  document.querySelectorAll('nav .item').forEach(el => el.classList.remove('active'));
  renderList(searchEl.value);
  viewEl.parentElement.scrollTop = 0;
}

searchEl.addEventListener('input', () => renderList(searchEl.value));

// 默认打开第一篇（最新）
if (ARTICLES.length) { show(0); }
renderList('');
</script>
